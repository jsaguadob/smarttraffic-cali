name: Verificación

on:
  push:
    branches: [main, desarrollo]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 17 y 21)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compilar y ejecutar las pruebas
        run: ./test.sh

  postgresql:
    name: Backend contra PostgreSQL 16 real
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smarttraffic
          POSTGRES_PASSWORD: prueba-ci-2026
          POSTGRES_DB: smarttraffic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smarttraffic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pruebas de integración de la API contra PostgreSQL
        env:
          SMARTTRAFFIC_TEST_DB_URL: jdbc:postgresql://localhost:5432/smarttraffic_test
          SMARTTRAFFIC_TEST_DB_USER: smarttraffic
          SMARTTRAFFIC_TEST_DB_PASSWORD: prueba-ci-2026
        run: ./test.sh

  frontend:
    name: Pantalla (React + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar, revisar tipos y compilar
        working-directory: frontend
        run: |
          npm ci
          npm run build
